name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Set a global environment variable for the PUPPET_AUTH_TOKEN for all jobs as well as the BUNDLE_RUBYGEMS___PUPPETCORE__PUPPET__COM
env:
  PUPPET_AUTH_TOKEN: ${{ secrets.PUPPET_AUTH_TOKEN }}
  BUNDLE_RUBYGEMS___PUPPETCORE__PUPPET__COM: "forge-key:${{ secrets.PUPPET_AUTH_TOKEN }}"

jobs:
  rspec:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        ruby_version:
          - '3.2'
          - '3.4'
          - '4.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler-cache: true

      - name: Dump native extension build logs
        if: failure()
        run: |
          find vendor/bundle -name mkmf.log -o -name gem_make.out | while read -r f; do
            echo "::group::$f"; cat "$f"; echo ::endgroup::
          done
          echo "::group::compiler info"; which -a gcc cc || true; gcc --version || true
          ruby -rrbconfig -e 'puts RbConfig::CONFIG.values_at("CC","CFLAGS","LDFLAGS").inspect'; echo ::endgroup::

      - name: Print bundle environment
        run: |
          echo ::group::bundler environment
          bundle env
          echo ::endgroup::

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.LINUX_FIXTURE_KEY }}
            ${{ secrets.WINDOWS_FIXTURE_KEY }}

      - name: Get fixtures
        run: bundle exec rake 'sce:fixtures'

      - name: Run RSpec
        run: bundle exec rspec spec/abide_dev_utils_spec.rb spec/abide_dev_utils/**/*_spec.rb
